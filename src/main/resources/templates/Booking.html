<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Đặt bàn | Quản lý quán cà phê</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Google Fonts - Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared layout styles -->
  <link rel="stylesheet" href="/css/doanhthu.css">
</head>

<body>

  <!-- Sidebar -->
  <div th:replace="~{fragments/sidebar :: sidebar('BOOKING')}"></div>

  <!-- Main content -->
  <main class="main-content">

    <!-- Header -->
    <div class="header-row">
      <div class="page-title">
        <h2>Quản lý Đặt bàn</h2>
        <p th:text="${#lists.size(bookings)} + ' yêu cầu đặt bàn'">0 yêu cầu đặt bàn</p>
      </div>
      <div class="ms-auto" sec:authorize="hasRole('ADMIN')">
        <a href="/Booking/new" class="btn btn-sm btn-primary">
          <i class="bi bi-plus-circle me-1"></i> Thêm đặt bàn
        </a>
      </div>
    </div>

    <!-- Bookings table -->
    <div class="custom-card">
      <div class="table-responsive">
        <table class="table align-middle orders-table">
          <thead>
            <tr>
              <th scope="col">Khách hàng</th>
              <th scope="col">Số điện thoại</th>
              <th scope="col">Email</th>
              <th scope="col">Thời gian đặt</th>
              <th scope="col">Số khách</th>
              <th scope="col">Ghi chú</th>
              <th scope="col">Giữ bàn</th>
              <th scope="col">Thời gian gửi</th>
              <th scope="col" sec:authorize="hasRole('ADMIN')">Thao tác</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(bookings)}">
              <td colspan="8" class="text-center text-muted py-4">Chưa có yêu cầu đặt bàn nào.</td>
            </tr>

            <tr th:each="b : ${bookings}">
              <td th:text="${b.name}">Tên khách</td>
              <td th:text="${b.phone}">Số điện thoại</td>
              <td th:text="${b.email}">Email</td>
              <td th:text="${b.bookingTime != null ? #temporals.format(b.bookingTime, 'dd/MM/yyyy HH:mm') : ''}">01/01/2026 09:00</td>
              <td th:text="${b.guests}">2</td>
              <td th:text="${b.note}">Ghi chú</td>
              <td th:text="${b.reservedTableNumber != null ? 'Bàn ' + b.reservedTableNumber : ''}">Bàn 1</td>
              <td th:text="${b.createdAt != null ? #temporals.format(b.createdAt, 'dd/MM/yyyy HH:mm') : ''}">01/01/2026 08:30</td>
              <td sec:authorize="hasRole('ADMIN')">
                <div class="d-flex gap-2">
                  <a th:href="@{'/Booking/edit/' + ${b.id}}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-pencil"></i>
                  </a>
                  <a th:href="@{'/Booking/delete/' + ${b.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Bạn có chắc muốn xóa đặt bàn này?');">
                    <i class="bi bi-trash"></i>
                  </a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
