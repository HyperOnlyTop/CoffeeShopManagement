<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Đặt bàn | Quản lý quán cà phê</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Google Fonts - Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared layout styles -->
  <link rel="stylesheet" href="/css/doanhthu.css">
  <link rel="stylesheet" href="/css/accounts-page.css">
</head>

<body>

  <!-- Sidebar -->
  <div th:replace="~{fragments/sidebar :: sidebar('BOOKING')}"></div>

  <!-- Main content -->
  <main class="main-content">

    <!-- Header -->
    <div class="header-row">
      <div class="page-title">
        <h2>Quản lý Đặt bàn</h2>
        <p id="bookingPageSubtitle" class="text-muted small mb-0" th:text="|${bookingStatTotal} yêu cầu đặt bàn|">0 yêu cầu đặt bàn</p>
      </div>
      <div class="header-actions" sec:authorize="hasRole('ADMIN')">
        <a href="/Booking/new" class="btn stock-import-btn text-decoration-none d-inline-flex align-items-center">
          <i class="bi bi-plus-lg"></i> Thêm đặt bàn
        </a>
      </div>
    </div>

    <!-- Summary cards -->
    <div class="row g-3 mb-4 stock-summary-row">
      <div class="col-md-3 col-sm-6">
        <div class="custom-card stock-stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stock-stat-icon stock-stat-total">
              <i class="bi bi-calendar-event"></i>
            </div>
            <div>
              <p class="stock-stat-label mb-1">Tổng yêu cầu</p>
              <p class="stock-stat-value mb-0" th:text="${bookingStatTotal}">0</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="custom-card stock-stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stock-stat-icon stock-stat-available">
              <i class="bi bi-check2-circle"></i>
            </div>
            <div>
              <p class="stock-stat-label mb-1">Đã xác nhận</p>
              <p class="stock-stat-value mb-0" th:text="${bookingStatConfirmed}">0</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="custom-card stock-stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stock-stat-icon stock-stat-low">
              <i class="bi bi-slash-circle"></i>
            </div>
            <div>
              <p class="stock-stat-label mb-1">Đã hủy</p>
              <p class="stock-stat-value mb-0" th:text="${bookingStatCancelled}">0</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="custom-card stock-stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stock-stat-icon customer-stat-redeem-icon">
              <i class="bi bi-people"></i>
            </div>
            <div>
              <p class="stock-stat-label mb-1">Tổng suất khách</p>
              <p class="stock-stat-value mb-0" th:text="${bookingStatGuestsSum}">0</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="custom-card">
      <div class="d-flex flex-wrap gap-3 align-items-center stock-toolbar mb-3">
        <div class="stock-search">
          <i class="bi bi-search"></i>
          <input type="text" id="bookingSearchInput" placeholder="Tìm tên, SĐT, email, ghi chú…" aria-label="Tìm đặt bàn">
        </div>
        <div class="dropdown admin-date-filter">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle rounded-pill px-3 d-inline-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" id="bookingDateFilterBtn">
            <i class="bi bi-calendar3"></i>
            <span id="bookingDateFilterLabel">Mọi ngày</span>
          </button>
          <div class="dropdown-menu dropdown-menu-start p-3 shadow border-0 admin-date-filter-panel" aria-labelledby="bookingDateFilterBtn">
            <label class="form-label small fw-semibold mb-1" for="bookingDateFilterInput">Lọc theo ngày giờ đặt bàn</label>
            <input type="date" class="form-control form-control-sm" id="bookingDateFilterInput">
            <button type="button" class="btn btn-link btn-sm text-decoration-none p-0 mt-2" id="bookingDateFilterClear">Xóa lọc ngày</button>
          </div>
        </div>
        <div class="stock-filters ms-md-auto" id="bookingSegmentFilters">
          <button class="stock-filter active" type="button" data-booking-segment="ALL">Tất cả</button>
          <button class="stock-filter" type="button" data-booking-segment="CONFIRMED">Đã xác nhận</button>
          <button class="stock-filter" type="button" data-booking-segment="CANCELLED">Đã hủy</button>
          <button class="stock-filter" type="button" data-booking-segment="WITH_TABLE">Có giữ bàn</button>
          <button class="stock-filter" type="button" data-booking-segment="UPCOMING">Sắp tới</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle orders-table stock-table booking-table mb-0">
          <thead>
            <tr>
              <th scope="col" class="stock-th-wrap">
                <button type="button" class="stock-th-sort" data-sort="name" title="Sắp xếp theo tên khách">
                  <span>Khách hàng</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap">
                <button type="button" class="stock-th-sort" data-sort="phone" title="Sắp xếp theo SĐT">
                  <span>Số điện thoại</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap">
                <button type="button" class="stock-th-sort" data-sort="email" title="Sắp xếp theo email">
                  <span>Email</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap">
                <button type="button" class="stock-th-sort" data-sort="bookingTime" title="Sắp xếp theo thời gian đặt">
                  <span>Thời gian đặt</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap">
                <button type="button" class="stock-th-sort" data-sort="guests" title="Sắp xếp theo số khách">
                  <span>Số khách</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap">
                <button type="button" class="stock-th-sort" data-sort="note" title="Sắp xếp theo ghi chú">
                  <span>Ghi chú</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap">
                <button type="button" class="stock-th-sort" data-sort="table" title="Sắp xếp theo bàn giữ">
                  <span>Giữ bàn</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap">
                <button type="button" class="stock-th-sort" data-sort="created" title="Sắp xếp theo thời gian gửi">
                  <span>Thời gian gửi</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap stock-th-actions" sec:authorize="hasRole('ADMIN')"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(bookings)}" sec:authorize="hasRole('ADMIN')">
              <td colspan="9" class="text-center text-muted py-4">Chưa có yêu cầu đặt bàn nào.</td>
            </tr>
            <tr th:if="${#lists.isEmpty(bookings)}" sec:authorize="hasAnyRole('CASHIER','SERVER')">
              <td colspan="8" class="text-center text-muted py-4">Chưa có yêu cầu đặt bàn nào.</td>
            </tr>

            <tr th:each="b : ${bookings}" class="booking-data-row"
                th:data-booking-status="${b.status != null ? b.status.name() : ''}"
                th:data-has-table="${b.reservedTableNumber != null}"
                th:data-upcoming="${b.bookingTime != null and bookingPageNow != null and b.bookingTime.isAfter(bookingPageNow)}"
                th:data-sort-booking="${b.bookingTime != null ? #temporals.format(b.bookingTime, 'yyyy-MM-dd HH:mm:ss') : ''}"
                th:data-sort-created="${b.createdAt != null ? #temporals.format(b.createdAt, 'yyyy-MM-dd HH:mm:ss') : ''}"
                th:data-booking-day="${b.bookingTime != null ? #temporals.format(b.bookingTime, 'yyyy-MM-dd') : ''}">
              <td th:text="${b.name}">Tên khách</td>
              <td th:text="${b.phone}">Số điện thoại</td>
              <td th:text="${b.email}">Email</td>
              <td th:text="${b.bookingTime != null ? #temporals.format(b.bookingTime, 'dd/MM/yyyy HH:mm') : ''}">01/01/2026 09:00</td>
              <td th:text="${b.guests}">2</td>
              <td th:text="${b.note}">Ghi chú</td>
              <td th:text="${b.reservedTableNumber != null ? 'Bàn ' + b.reservedTableNumber : '—'}">Bàn 1</td>
              <td th:text="${b.createdAt != null ? #temporals.format(b.createdAt, 'dd/MM/yyyy HH:mm') : ''}">01/01/2026 08:30</td>
              <td sec:authorize="hasRole('ADMIN')">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                  <a th:href="@{'/Booking/edit/' + ${b.id}}" class="icon-circle-btn text-decoration-none" title="Sửa" aria-label="Sửa đặt bàn">
                    <i class="bi bi-pencil"></i>
                  </a>
                  <a th:href="@{'/Booking/delete/' + ${b.id}}" class="icon-circle-btn icon-circle-btn-danger text-decoration-none" title="Xóa" aria-label="Xóa đặt bàn" onclick="return confirm('Bạn có chắc muốn xóa đặt bàn này?');">
                    <i class="bi bi-trash"></i>
                  </a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin-common.js"></script>
  <script th:src="@{/js/booking-page.js}"></script>
</body>

</html>
