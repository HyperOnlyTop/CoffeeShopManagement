<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Menu | Quản lý quán cà phê</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/doanhthu.css">
  <link rel="stylesheet" href="/css/accounts-page.css">
</head>

<body>

  <div th:replace="~{fragments/sidebar :: sidebar('MENU')}"></div>

  <main class="main-content">

    <div class="header-row">
      <div class="page-title">
        <h2>Quản lý Menu</h2>
        <p id="menuPageSubtitle" class="text-muted small mb-0" th:text="|${menuStatTotal} món trong thực đơn|">0 món trong thực đơn</p>
      </div>
      <div class="header-actions">
        <button class="btn stock-import-btn" type="button">
          <i class="bi bi-plus-lg"></i> Thêm món mới
        </button>
      </div>
    </div>

    <div class="row g-3 mb-4 stock-summary-row">
      <div class="col-md-3 col-sm-6">
        <div class="custom-card stock-stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stock-stat-icon stock-stat-total">
              <i class="bi bi-cup-hot"></i>
            </div>
            <div>
              <p class="stock-stat-label mb-1">Tổng món</p>
              <p class="stock-stat-value mb-0" th:text="${menuStatTotal}">0</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="custom-card stock-stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stock-stat-icon stock-stat-available">
              <i class="bi bi-check-circle"></i>
            </div>
            <div>
              <p class="stock-stat-label mb-1">Còn sẵn</p>
              <p class="stock-stat-value mb-0" th:text="${menuStatAvailable}">0</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="custom-card stock-stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stock-stat-icon stock-stat-low">
              <i class="bi bi-pause-circle"></i>
            </div>
            <div>
              <p class="stock-stat-label mb-1">Tạm hết</p>
              <p class="stock-stat-value mb-0" th:text="${menuStatUnavailable}">0</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="custom-card stock-stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stock-stat-icon customer-stat-redeem-icon">
              <i class="bi bi-grid"></i>
            </div>
            <div>
              <p class="stock-stat-label mb-1">Danh mục</p>
              <p class="stock-stat-value mb-0" th:text="${menuStatCategories}">0</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="custom-card">
      <div class="d-flex flex-wrap gap-3 align-items-center stock-toolbar mb-3">
        <div class="stock-search">
          <i class="bi bi-search"></i>
          <input id="menuSearchInput" type="text" placeholder="Tìm tên hoặc mô tả món…" aria-label="Tìm món">
        </div>
        <div class="stock-filters ms-md-auto flex-grow-1 flex-md-grow-0" id="menuCategoryFilters">
          <button type="button" class="stock-filter active" data-category="ALL">Tất cả</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle menu-admin-table stock-table mb-0">
          <thead>
            <tr>
              <th scope="col" class="stock-th-wrap menu-th-thumb text-center">Ảnh</th>
              <th scope="col" class="stock-th-wrap menu-th-name">
                <button type="button" class="stock-th-sort" data-sort="name" title="Sắp xếp theo tên">
                  <span>Tên món</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap menu-th-category">
                <button type="button" class="stock-th-sort" data-sort="category" title="Sắp xếp theo danh mục">
                  <span>Danh mục</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap d-none d-md-table-cell menu-th-desc">
                <button type="button" class="stock-th-sort" data-sort="description" title="Sắp xếp theo mô tả">
                  <span>Mô tả</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap menu-th-price text-end">
                <button type="button" class="stock-th-sort stock-th-sort-end" data-sort="price" title="Sắp xếp theo giá bán">
                  <span>Giá bán</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap d-none d-lg-table-cell menu-th-cost text-end">
                <button type="button" class="stock-th-sort stock-th-sort-end" data-sort="cost" title="Sắp xếp theo giá vốn">
                  <span>Giá vốn</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap menu-th-status text-center">
                <button type="button" class="stock-th-sort stock-th-sort-center" data-sort="status" title="Sắp xếp theo trạng thái">
                  <span>Trạng thái</span><i class="bi bi-arrow-down-up stock-sort-icon" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="stock-th-wrap stock-th-actions menu-th-actions text-end"><span class="visually-hidden">Thao tác</span></th>
            </tr>
          </thead>
          <tbody id="menuTableBody">
            <tr th:if="${menuItems == null or #lists.isEmpty(menuItems)}" class="menu-empty-placeholder">
              <td colspan="8" class="text-center text-muted py-4">Chưa có món nào. Bấm <strong>Thêm món mới</strong> để bắt đầu.</td>
            </tr>
            <tr class="menu-admin-row" th:each="item : ${menuItems}"
                th:data-item-id="${item.id}"
                th:data-category="${item.category != null ? item.category.name : 'Khác'}">
              <td class="menu-td-thumb text-center align-middle">
                <img class="menu-admin-thumb rounded-2 mx-auto"
                     th:src="${item.imageUrl != null ? item.imageUrl : 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=200&h=200&fit=crop'}"
                     th:alt="${item.name}" alt="Món">
              </td>
              <td class="menu-name-cell align-middle">
                <strong class="menu-item-title d-block" th:text="${item.name}">Tên món</strong>
              </td>
              <td class="text-muted small menu-category-cell align-middle" th:text="${item.category != null ? item.category.name : 'Khác'}">Danh mục</td>
              <td class="d-none d-md-table-cell small text-muted menu-desc-cell align-middle"
                  th:title="${item.description}"
                  th:text="${item.description != null ? item.description : '—'}">Mô tả</td>
              <td class="text-end fw-semibold text-nowrap menu-price align-middle"
                  th:text="${item.price != null ? item.price + ' đ' : '0 đ'}">0 đ</td>
              <td class="text-end small text-muted text-nowrap d-none d-lg-table-cell menu-cost align-middle"
                  th:text="${item.cost != null ? item.cost + ' đ' : '—'}">—</td>
              <td class="text-center align-middle menu-td-status">
                <span class="menu-badge"
                      th:classappend="${item.status != null and item.status.name() == 'UNAVAILABLE'} ? ' menu-badge-out' : ' menu-badge-available'"
                      th:text="${item.status != null and item.status.name() == 'UNAVAILABLE'} ? 'Tạm hết' : 'Còn sẵn'">Còn sẵn</span>
              </td>
              <td class="text-end pe-0 align-middle">
                <button class="menu-edit-btn" type="button" aria-label="Chỉnh sửa món" title="Chỉnh sửa món">
                  <i class="bi bi-pencil"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <div class="modal fade" id="addItemModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 pb-0 px-4 pt-4">
          <h5 class="modal-title fw-semibold">Thêm món mới</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body px-4 pb-0">
          <form id="addItemForm">
            <div class="mb-3">
              <label class="form-label fw-medium">Tên món</label>
              <input id="addItemName" type="text" class="form-control" placeholder="VD: Cà phê đen đá" required>
            </div>
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label fw-medium">Giá bán (đ)</label>
                <input id="addItemPrice" type="number" class="form-control" value="65000" min="0" step="1000" required>
              </div>
              <div class="col-6">
                <label class="form-label fw-medium">Danh mục</label>
                <select id="addItemCategory" class="form-select" required>
                  <option value="" selected disabled>Đang tải danh mục...</option>
                </select>
              </div>
            </div>
            <div class="mt-3 mb-2">
              <label class="form-label fw-medium">Mô tả</label>
              <textarea id="addItemDescription" rows="3" class="form-control" placeholder="Mô tả ngắn về món..."></textarea>
            </div>
            <div class="mt-2 mb-2">
              <label class="form-label fw-medium">Link ảnh (URL)</label>
              <input id="addItemImageUrl" type="url" class="form-control" placeholder="https://...">
            </div>
          </form>
        </div>
        <div class="modal-footer border-0 px-4 pb-4 pt-3 d-flex justify-content-between">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" form="addItemForm" class="btn btn-warning px-4">Thêm món</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editItemModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 pb-0 px-4 pt-4">
          <h5 class="modal-title fw-semibold" id="editItemModalLabel">Cà phê sữa đá</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body px-4 pb-0">
          <form id="editItemForm">
            <div class="mb-3">
              <img id="editItemImage"
                src="https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=600&h=400&fit=crop" alt="Món"
                class="img-fluid rounded-3 w-100" style="max-height: 220px; object-fit: cover;">
            </div>
            <div class="mb-3">
              <label class="form-label fw-medium">Tên món</label>
              <input id="editItemName" type="text" class="form-control" required>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label fw-medium">Giá bán (đ)</label>
                <input id="editItemPriceInput" type="number" class="form-control" min="0" step="1000" required>
              </div>
              <div class="col-6">
                <label class="form-label fw-medium">Giá vốn (đ)</label>
                <input id="editItemCostInput" type="number" class="form-control" min="0" step="1000">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-medium">Danh mục</label>
              <select id="editItemCategory" class="form-select">
                <option value="" selected disabled>Đang tải danh mục...</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-medium">Mô tả</label>
              <textarea id="editItemDescription" rows="3" class="form-control"></textarea>
            </div>
            <div class="mb-2">
              <label class="form-label fw-medium">Link ảnh (URL)</label>
              <input id="editItemImageUrl" type="url" class="form-control" placeholder="https://...">
            </div>
            <div class="mb-2 small">
              <span class="text-muted me-2">Trạng thái:</span>
              <span id="editItemStatus" class="badge rounded-pill bg-success-subtle text-success px-3 py-2">Có sẵn</span>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0 px-4 pb-4 pt-3 d-flex justify-content-between">
          <button id="toggleAvailabilityBtn" type="button" class="btn btn-outline-secondary">Tạm ẩn món</button>
          <button id="editItemSaveBtn" type="button" class="btn btn-warning px-4">Lưu thay đổi</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin-common.js"></script>
  <script th:src="@{/js/menu-page.js}"></script>
</body>

</html>
