<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Bàn | Quản lý quán cà phê</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- Google Fonts - Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Shared layout styles -->
  <link rel="stylesheet" href="/css/doanhthu.css">

  <link rel="stylesheet" th:href="@{/css/tables-page.css}">
</head>

<body>
  <!-- Sidebar -->
  <div th:replace="~{fragments/sidebar :: sidebar('TABLES')}"></div>

  <main class="main-content">
    <div class="header-row">
      <div class="page-title">
        <h2>Quản lý Bàn</h2>
        <p>
          <span th:text="${occupiedCount} + '/' + ${totalTables} + ' bàn đang có khách'">0/20 bàn đang có khách</span>
          <span class="text-muted" th:if="${reservedCount != null}">
            · <span th:text="${reservedCount}">0</span> bàn đang được giữ
          </span>
        </p>
      </div>
      <div class="header-actions">
        <a href="/Order" class="btn btn-outline-secondary">
          <i class="bi bi-bag me-1"></i> Xem đơn hàng
        </a>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-6 col-md-4 col-lg-3" th:each="t : ${tables}">
        <div class="table-card" th:attr="data-table=${t.number}">
          <div class="table-card-header">
            <p class="table-card-title" th:text="${t.label}">Bàn 1</p>
            <span class="table-badge"
                  th:classappend="${t.occupied} ? ' table-badge-occupied' : (${t.reserved} ? ' table-badge-reserved' : ' table-badge-free')"
                  th:text="${t.occupied} ? 'Có khách' : (${t.reserved} ? 'Đã đặt' : 'Trống')">Trống</span>
          </div>
          <p class="table-meta mb-1" th:if="${t.occupied}">
            <strong th:text="${t.orderCode}">ORD-0000</strong>
            <span th:if="${t.customerName != null && !t.customerName.isBlank()}"> · <span th:text="${t.customerName}">Khách</span></span>
          </p>
          <p class="table-meta" th:if="${t.occupied}">
            <small>Trạng thái: </small><span th:text="${t.statusLabel}">PENDING</span>
          </p>
          <p class="table-meta mb-1" th:if="${!t.occupied and t.reserved}">
            <small>Khách: </small><span th:text="${t.customerName}">Tên khách</span>
            <span th:if="${t.bookingPhone != null && !t.bookingPhone.isBlank()}"> · <small>SĐT: </small><span th:text="${t.bookingPhone}">090...</span></span>
          </p>
          <p class="table-meta" th:if="${!t.occupied and t.reserved}">
            <small>Giờ đặt: </small>
            <span th:text="${t.bookingTime != null ? #temporals.format(t.bookingTime, 'dd/MM/yyyy HH:mm') : ''}">01/01/2026 09:00</span>
          </p>
          <p class="table-meta" th:unless="${t.occupied}">
            <small th:text="${t.reserved} ? 'Bàn đang được giữ chỗ.' : 'Chưa có đơn tại bàn.'">Chưa có đơn tại bàn.</small>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal: Chi tiết bàn / đơn tại bàn -->
  <div class="modal fade" id="tableDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 pb-0 px-4 pt-4">
          <h5 class="modal-title fw-semibold" id="tableDetailTitle">Chi tiết bàn</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body px-4 pb-0">
          <div id="tableDetailBody" class="small text-muted">Đang tải...</div>

          <!-- Phần booking chờ gán bàn (chỉ hiện khi bàn AVAILABLE) -->
          <div id="pendingBookingsSection" class="mt-3 pt-3 border-top" style="display:none;">
            <h6 class="fw-semibold mb-2"><i class="bi bi-calendar-event me-1"></i> Booking chờ gán bàn</h6>
            <div id="pendingBookingsList" class="small"></div>
          </div>
        </div>
        <div class="modal-footer border-0 px-4 pb-4 pt-3 d-flex justify-content-between flex-wrap gap-2">
          <div class="d-flex gap-2 flex-wrap" id="tableActionButtons">
            <!-- Nút cho bàn OCCUPIED -->
            <button type="button" class="btn btn-outline-danger btn-sm" id="btnReleaseTable" style="display:none;">
              <i class="bi bi-box-arrow-right me-1"></i> Trả bàn
            </button>
            <!-- Nút cho bàn RESERVED -->
            <button type="button" class="btn btn-success btn-sm" id="btnCheckinBooking" style="display:none;">
              <i class="bi bi-check-lg me-1"></i> Khách đã đến
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnUnassignBooking" style="display:none;">
              <i class="bi bi-x-circle me-1"></i> Bỏ gán bàn
            </button>
            <button type="button" class="btn btn-outline-danger btn-sm" id="btnCancelBooking" style="display:none;">
              <i class="bi bi-slash-circle me-1"></i> Hủy booking
            </button>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Hủy booking với lý do -->
  <div class="modal fade" id="cancelBookingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow rounded-4">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-semibold">Hủy booking</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body pt-2">
          <label class="form-label small text-muted mb-1" for="cancelBookingNoteInput">Lý do (tuỳ chọn)</label>
          <textarea class="form-control form-control-sm" id="cancelBookingNoteInput" rows="3" placeholder="Ví dụ: khách báo huỷ, trễ giờ…"></textarea>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
          <button type="button" class="btn btn-sm btn-danger" id="confirmCancelBookingBtn">Hủy booking</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/tables-page.js}"></script>
</body>

</html>
