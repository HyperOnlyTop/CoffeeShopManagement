<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew &amp; Co. | Tất cả đánh giá</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Reuse base style so font & colors khớp hệ thống -->
    <link rel="stylesheet" href="/css/doanhthu.css">

    <link rel="stylesheet" th:href="@{/css/reviews.css}">
</head>
<body>
<div class="page-shell">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div>
            <div class="text-uppercase small reviews-page-eyebrow">Khách hàng nói gì</div>
            <h1 class="page-title mb-1">Tất cả đánh giá</h1>
            <div class="text-muted-coffee small">Các đánh giá mới nhất được hiển thị trước.</div>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/#testimonials}" class="btn btn-outline-black-dark">
                <i class="bi bi-arrow-left me-1"></i>
                Về trang chủ
            </a>
            <a th:href="@{/#testimonials}" class="btn btn-primary-gold">
                <i class="bi bi-chat-heart me-1"></i>
                Gửi đánh giá
            </a>
        </div>
    </div>

    <div class="row g-4 mb-4" th:if="${customerReviews != null and !#lists.isEmpty(customerReviews)}">
        <div class="col-md-4" th:each="review : ${customerReviews}">
            <div class="testimonial-card">
                <div class="text-warning mb-2">
                    <span th:each="i : ${#numbers.sequence(1, review.rating)}">★</span>
                </div>
                <p class="small text-muted-coffee mb-3" th:text="${review.comment}">Nội dung đánh giá</p>
                <div class="fw-semibold" th:text="${review.customerName}">Tên khách</div>
                <div class="small text-muted-coffee" th:text="${review.customerRole}">Vai trò</div>
            </div>
        </div>
    </div>
    <div class="row" th:if="${customerReviews == null or #lists.isEmpty(customerReviews)}">
        <div class="col-12">
            <div class="bg-white rounded-4 p-4 shadow-sm">
                <p class="text-center text-muted-coffee mb-0">Hiện chưa có đánh giá nào. Hãy là người đầu tiên để lại cảm nhận về Brew &amp; Co.</p>
            </div>
        </div>
    </div>

    <nav class="d-flex justify-content-center" th:if="${totalPages != null and totalPages > 1}">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${currentPage == 0} ? ' disabled'">
                <a class="page-link" th:href="@{/reviews(page=${currentPage - 1})}" aria-label="Trang trước">«</a>
            </li>

            <li class="page-item" th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${p == currentPage} ? ' active'">
                <a class="page-link" th:href="@{/reviews(page=${p})}" th:text="${p + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? ' disabled'">
                <a class="page-link" th:href="@{/reviews(page=${currentPage + 1})}" aria-label="Trang sau">»</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
