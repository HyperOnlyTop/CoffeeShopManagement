<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | Quản lý quán cà phê</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom dashboard CSS -->
    <link rel="stylesheet" href="/css/doanhthu.css">
    <style>
        body.register-page {
            display: block !important;
            background-color: #000;
        }
    </style>
</head>
<body class="register-page" style="min-height:100vh; margin:0;">

<div style="position:relative; min-height:100vh; width:100vw; overflow:hidden;">
    <!-- Background image + overlay covering full screen -->
    <div style="position:absolute; inset:0; background:url('https://images.pexels.com/photos/6207294/pexels-photo-6207294.jpeg?auto=compress&cs=tinysrgb&w=1600') center/cover no-repeat;"></div>
    <div style="position:absolute; inset:0; background:linear-gradient(135deg, rgba(0,0,0,0.85), rgba(0,0,0,0.45));"></div>

    <!-- Content on top of image -->
    <div class="d-flex flex-column justify-content-center align-items-center text-white text-center" style="position:relative; min-height:100vh; padding:24px;">
        <div class="mb-4">
            <div class="d-flex align-items-center justify-content-center mb-3">
                <img src="https://ui-avatars.com/api/?name=B&C&background=111&color=fff&rounded=true" alt="Logo" class="brand-img me-2">
                <div class="text-start">
                    <h5 class="mb-0">Brew &amp; Co.</h5>
                    <small class="text-warning">Coffee Management</small>
                </div>
            </div>
            <div style="max-width:520px;">
                <h2 class="fw-semibold mb-3">Tạo tài khoản để bắt đầu quản lý quán</h2>
                <p class="text-light">Quản lý nhân viên, đơn hàng và kho nguyên liệu trong một nơi duy nhất.</p>
            </div>
        </div>

        <div class="card border-0 shadow-lg" style="background:rgba(255,245,233,0.96); border-radius:24px; max-width:480px; width:100%;">
            <div class="card-body p-4 p-md-5 text-dark text-start">
                <h3 class="fw-bold mb-3">Đăng ký tài khoản</h3>

                <!-- Lưu ý: Form này mới chỉ là giao diện, chưa xử lý lưu vào database -->
                <form onsubmit="return false;">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Họ và tên</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0" placeholder="Nhập họ và tên" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control border-start-0" placeholder="Nhập email" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-person-badge"></i></span>
                            <input type="text" class="form-control border-start-0" placeholder="Chọn tên đăng nhập" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control border-start-0" placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Nhập lại mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control border-start-0" placeholder="Nhập lại mật khẩu" required>
                        </div>
                    </div>

                    <button type="submit" class="btn w-100 mt-2" style="background-color:#1A1613; color:#fff; border-radius:999px; padding:10px 0;">
                        <i class="bi bi-person-plus me-2"></i>Đăng ký
                    </button>
                </form>

                <p class="mt-3 small text-muted text-center">
                    Đã có tài khoản?
                    <a th:href="@{/login}" class="text-decoration-none">Đăng nhập</a>
                </p>
            </div>
        </div>

        <div class="mt-4 text-muted small">
            <span class="text-warning">Brew &amp; Co.</span> © 2024 — All rights reserved
        </div>
    </div>
</div>

</body>
</html>
