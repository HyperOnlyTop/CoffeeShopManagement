<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Kho hàng | Quản lý quán cà phê</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Google Fonts - Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared layout styles -->
  <link rel="stylesheet" href="/css/doanhthu.css">
</head>

<body>

  <!-- Sidebar -->
  <div th:replace="~{fragments/sidebar :: sidebar('INVENTORY')}"></div>

  <!-- Main content -->
  <main class="main-content">

    <!-- Header -->
    <div class="header-row">
      <div class="page-title">
        <h2>Quản lý Kho hàng</h2>
        <p>1 mặt hàng hết hàng · 3 mặt hàng sắp hết</p>
      </div>
      <div class="header-actions">
        <button class="btn stock-import-btn" type="button">
          <i class="bi bi-plus-lg"></i> Nhập hàng
        </button>
      </div>
    </div>

    <!-- Summary cards -->
    <div class="row g-3 mb-4 stock-summary-row">
      <div class="col-md-3 col-sm-6">
        <div class="custom-card stock-stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stock-stat-icon stock-stat-total">
              <i class="bi bi-archive"></i>
            </div>
            <div>
              <p class="stock-stat-label mb-1">Tổng mặt hàng</p>
              <p class="stock-stat-value mb-0" id="stockTotalItems">0</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="custom-card stock-stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stock-stat-icon stock-stat-available">
              <i class="bi bi-check-circle"></i>
            </div>
            <div>
              <p class="stock-stat-label mb-1">Còn hàng</p>
              <p class="stock-stat-value mb-0" id="stockInStock">0</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="custom-card stock-stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stock-stat-icon stock-stat-low">
              <i class="bi bi-exclamation-triangle"></i>
            </div>
            <div>
              <p class="stock-stat-label mb-1">Sắp hết / Hết</p>
              <p class="stock-stat-value mb-0" id="stockLowOut">0 / 0</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="custom-card stock-stat-card">
          <div class="d-flex align-items-center gap-3">
            <div class="stock-stat-icon stock-stat-value">
              <i class="bi bi-cash-coin"></i>
            </div>
            <div>
              <p class="stock-stat-label mb-1">Giá trị tồn kho</p>
              <p class="stock-stat-value mb-0" id="stockInventoryValue">0 đ</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toolbar + Stock table trong cùng custom card -->
    <div class="custom-card">
      <div class="d-flex flex-wrap gap-3 align-items-center stock-toolbar mb-3">
        <div class="stock-search">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Tìm kiếm nguyên liệu..." aria-label="Tìm kiếm nguyên liệu">
        </div>
        <div class="stock-filters">
          <button class="stock-filter active" type="button">Tất cả</button>
          <button class="stock-filter" type="button">Cà phê &amp; Trà</button>
          <button class="stock-filter" type="button">Sữa &amp; Kem</button>
          <button class="stock-filter" type="button">Nguyên liệu</button>
          <button class="stock-filter" type="button">Dụng cụ</button>
          <button class="stock-filter" type="button">Bao bì</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle stock-table mb-0">
          <thead>
            <tr>
              <th scope="col">Tên nguyên liệu</th>
              <th scope="col">Danh mục</th>
              <th scope="col">Tồn kho</th>
              <th scope="col">Mức tồn</th>
              <th scope="col">Giá/Đơn vị</th>
              <th scope="col">Nhà cung cấp</th>
              <th scope="col">Trạng thái</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody>
            <!-- Dữ liệu sẽ được render bằng JavaScript từ API /api/inventory/items -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal: Nhập hàng -->
  <div class="modal fade" id="stockImportModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 pb-0 px-4 pt-4">
          <h5 class="modal-title fw-semibold">Phiếu nhập hàng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body px-4 pb-0">
          <form id="stockImportForm">
            <input type="hidden" id="importItemId">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium">Tên nguyên liệu</label>
                <input type="text" class="form-control" id="importItemName" placeholder="VD: Cà phê rang xay" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium">Danh mục</label>
                <select class="form-select" id="importCategory">
                  <option value="" selected>Chọn danh mục</option>
                  <option>Cà phê &amp; Trà</option>
                  <option>Sữa &amp; Kem</option>
                  <option>Nguyên liệu</option>
                  <option>Dụng cụ</option>
                  <option>Bao bì</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label fw-medium">Số lượng nhập</label>
                <input type="number" class="form-control" id="importQuantity" min="0" step="0.1" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-medium">Đơn vị</label>
                <input type="text" class="form-control" id="importUnit" placeholder="VD: kg, lít, lon" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-medium">Giá / Đơn vị (đ)</label>
                <input type="number" class="form-control" id="importCost" min="0" step="1000">
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium">Nhà cung cấp</label>
                <input type="text" class="form-control" id="importSupplier" placeholder="VD: Trung Nguyên, Vinamilk">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium">Ngày nhập</label>
                <input type="date" class="form-control" id="importDate">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium">Ghi chú</label>
              <textarea class="form-control" id="importNote" rows="2" placeholder="Ghi chú thêm (nếu có)"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0 px-4 pb-4 pt-3 d-flex justify-content-between">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" form="stockImportForm" class="btn btn-warning px-4">Lưu phiếu nhập</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS + logic for Inventory page -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Admin common JS (logout confirm, etc.) -->
  <script src="/js/admin-common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (!window.bootstrap) return;

      var allItems = [];
      var formMode = 'import'; // 'import' | 'edit'
      var importBtn = document.querySelector('.stock-import-btn');
      var importModalEl = document.getElementById('stockImportModal');
      var searchInput = document.querySelector('.stock-search input');
      var tableBody = document.querySelector('.stock-table tbody');
      var filterButtons = document.querySelectorAll('.stock-filter');

      var totalItemsEl = document.getElementById('stockTotalItems');
      var inStockEl = document.getElementById('stockInStock');
      var lowOutEl = document.getElementById('stockLowOut');
      var inventoryValueEl = document.getElementById('stockInventoryValue');

      function renderTable(items) {
        if (!tableBody) return;
        tableBody.innerHTML = '';

        if (!items || items.length === 0) {
          var emptyRow = document.createElement('tr');
          emptyRow.innerHTML = '<td colspan="8" class="text-center text-muted py-4">Chưa có dữ liệu kho hàng</td>';
          tableBody.appendChild(emptyRow);
          return;
        }

        items.forEach(function (item) {
          var name = item.name || '(Chưa đặt tên)';
          var categoryName = item.category && item.category.name ? item.category.name : '-';
          var stock = item.currentStock != null ? Number(item.currentStock) : 0;
          var unit = item.unit || '';
          var maxStock = item.maxStock != null ? Number(item.maxStock) : 0;
          var percent = maxStock > 0 ? Math.round((stock / maxStock) * 100) : 0;
          if (percent < 0) percent = 0;
          if (percent > 100) percent = 100;

          var cost = item.costPerUnit != null ? Number(item.costPerUnit) : 0;
          var priceText = cost > 0 ? cost.toLocaleString('vi-VN') + ' đ' : '-';
          var supplierName = item.supplier && item.supplier.name ? item.supplier.name : '-';

          var statusLabel = '';
          var statusClass = '';
          var levelClass = '';
          if (item.status === 'IN_STOCK') {
            statusLabel = 'Còn hàng';
            statusClass = 'stock-status-in';
          } else if (item.status === 'LOW_STOCK') {
            statusLabel = 'Sắp hết';
            statusClass = 'stock-status-low';
            levelClass = 'stock-level-warning';
          } else if (item.status === 'OUT_OF_STOCK') {
            statusLabel = 'Hết hàng';
            statusClass = 'stock-status-out';
            levelClass = 'stock-level-empty';
          } else {
            statusLabel = item.status || '-';
            statusClass = 'stock-status-in';
          }

          var row = document.createElement('tr');
          row.innerHTML =
            '<td>' + name + '</td>' +
            '<td>' + categoryName + '</td>' +
            '<td><strong>' + stock + '</strong> ' + unit + '</td>' +
            '<td>' +
            '<div class="stock-level">' +
            '<div class="stock-level-bar ' + levelClass + '" style="width: ' + percent + '%;"></div>' +
            '</div>' +
            '<span class="stock-level-text">' + percent + '%</span>' +
            '</td>' +
            '<td>' + priceText + '</td>' +
            '<td>' + supplierName + '</td>' +
            '<td><span class="stock-status-badge ' + statusClass + '">' + statusLabel + '</span></td>' +
            '<td>' +
            '<button class="icon-circle-btn" type="button" aria-label="Chỉnh sửa nguyên liệu" title="Chỉnh sửa nguyên liệu" data-item-id="' + item.id + '">' +
            '<i class="bi bi-pencil"></i>' +
            '</button>' +
            '</td>';
          tableBody.appendChild(row);
        });
      }

      function updateSummary(items) {
        if (!items) items = [];
        var total = items.length;
        var inStockCount = items.filter(function (i) { return i.status === 'IN_STOCK'; }).length;
        var lowCount = items.filter(function (i) { return i.status === 'LOW_STOCK'; }).length;
        var outCount = items.filter(function (i) { return i.status === 'OUT_OF_STOCK'; }).length;
        var totalValue = 0;
        items.forEach(function (i) {
          var qty = i.currentStock != null ? Number(i.currentStock) : 0;
          var cost = i.costPerUnit != null ? Number(i.costPerUnit) : 0;
          totalValue += qty * cost;
        });

        if (totalItemsEl) totalItemsEl.textContent = total;
        if (inStockEl) inStockEl.textContent = inStockCount;
        if (lowOutEl) lowOutEl.textContent = lowCount + ' / ' + outCount;
        if (inventoryValueEl) inventoryValueEl.textContent = totalValue.toLocaleString('vi-VN') + ' đ';
      }

      // Mở modal nhập hàng
      if (importBtn && importModalEl) {
        var importModal = new bootstrap.Modal(importModalEl);
        var importForm = document.getElementById('stockImportForm');
        var importItemIdInput = document.getElementById('importItemId');
        var modalTitle = importModalEl.querySelector('.modal-title');
        var submitButton = importModalEl.querySelector('button[type="submit"]');

        importBtn.addEventListener('click', function () {
          if (importForm) {
            importForm.reset();
          }
          formMode = 'import';
          if (importItemIdInput) importItemIdInput.value = '';
          if (modalTitle) modalTitle.textContent = 'Phiếu nhập hàng';
          if (submitButton) submitButton.textContent = 'Lưu phiếu nhập';
          importModal.show();
        });

        if (importForm) {
          importForm.addEventListener('submit', function (e) {
            e.preventDefault();

            var name = document.getElementById('importItemName').value.trim();
            var category = document.getElementById('importCategory').value.trim();
            var quantityVal = document.getElementById('importQuantity').value;
            var unit = document.getElementById('importUnit').value.trim();
            var costVal = document.getElementById('importCost').value;
            var supplier = document.getElementById('importSupplier').value.trim();
            var dateVal = document.getElementById('importDate').value;
            var note = document.getElementById('importNote').value.trim();
            var itemId = importItemIdInput ? importItemIdInput.value : '';

            var quantity = quantityVal ? parseFloat(quantityVal) : 0;
            var unitCost = costVal ? parseFloat(costVal) : 0;

            if (!name || !quantity) {
              alert('Vui lòng nhập tên nguyên liệu và số lượng.');
              return;
            }

            if (formMode === 'import') {
              var payload = {
                name: name,
                categoryName: category || null,
                quantity: quantity,
                unit: unit || null,
                unitCost: unitCost,
                supplierName: supplier || null,
                importDate: dateVal || null,
                note: note || null
              };

              fetch('/api/inventory/import', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
              })
                .then(function (res) {
                  if (!res.ok) {
                    throw new Error('Lỗi khi lưu phiếu nhập');
                  }
                  return res.json();
                })
                .then(function () {
                  alert('Đã lưu phiếu nhập thành công.');
                  importModal.hide();
                  // Sau khi nhập hàng thành công, có thể reload danh sách kho
                  fetch('/api/inventory/items')
                    .then(function (res) { return res.json(); })
                    .then(function (items) {
                      allItems = items;
                      renderTable(allItems);
                      updateSummary(allItems);
                    })
                    .catch(function (err) { console.error(err); });
                })
                .catch(function (err) {
                  console.error(err);
                  alert('Không thể lưu phiếu nhập. Vui lòng thử lại.');
                });
            } else if (formMode === 'edit' && itemId) {
              var updatePayload = {
                name: name,
                categoryName: category || null,
                currentStock: quantity,
                unit: unit || null,
                unitCost: unitCost,
                supplierName: supplier || null
              };

              fetch('/api/inventory/items/' + encodeURIComponent(itemId), {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatePayload)
              })
                .then(function (res) {
                  if (!res.ok) {
                    throw new Error('Lỗi khi lưu chỉnh sửa');
                  }
                  return res.json();
                })
                .then(function () {
                  alert('Đã lưu thay đổi nguyên liệu.');
                  importModal.hide();
                  fetch('/api/inventory/items')
                    .then(function (res) { return res.json(); })
                    .then(function (items) {
                      allItems = items;
                      renderTable(allItems);
                      updateSummary(allItems);
                    })
                    .catch(function (err) { console.error(err); });
                })
                .catch(function (err) {
                  console.error(err);
                  alert('Không thể lưu chỉnh sửa. Vui lòng thử lại.');
                });
            }
          });
        }
      }

      // Bắt sự kiện click nút chỉnh sửa trong bảng (event delegation)
      if (tableBody) {
        tableBody.addEventListener('click', function (e) {
          var btn = e.target.closest('.icon-circle-btn');
          if (!btn) return;
          var itemId = btn.getAttribute('data-item-id');
          if (!itemId) return;

          var item = allItems.find(function (i) { return String(i.id) === String(itemId); });
          if (!item) return;

          // Prefill form với dữ liệu item
          var nameInput = document.getElementById('importItemName');
          var categorySelect = document.getElementById('importCategory');
          var quantityInput = document.getElementById('importQuantity');
          var unitInput = document.getElementById('importUnit');
          var costInput = document.getElementById('importCost');
          var supplierInput = document.getElementById('importSupplier');
          var dateInput = document.getElementById('importDate');

          if (nameInput) nameInput.value = item.name || '';
          if (categorySelect) {
            var catName = item.category && item.category.name ? item.category.name : '';
            var found = false;
            Array.from(categorySelect.options).forEach(function (opt) {
              if (opt.text.trim().toLowerCase() === catName.trim().toLowerCase()) {
                categorySelect.value = opt.value;
                found = true;
              }
            });
            if (!found) categorySelect.value = '';
          }
          if (quantityInput) quantityInput.value = item.currentStock != null ? Number(item.currentStock) : '';
          if (unitInput) unitInput.value = item.unit || '';
          if (costInput) costInput.value = item.costPerUnit != null ? Number(item.costPerUnit) : '';
          if (supplierInput) supplierInput.value = item.supplier && item.supplier.name ? item.supplier.name : '';
          if (dateInput) dateInput.value = item.lastUpdated || '';

          formMode = 'edit';
          if (importItemIdInput) importItemIdInput.value = item.id;
          if (modalTitle) modalTitle.textContent = 'Chỉnh sửa nguyên liệu';
          if (submitButton) submitButton.textContent = 'Lưu thay đổi';

          importModal.show();
        });
      }

      // Tải dữ liệu kho từ backend khi mở trang
      if (tableBody) {
        fetch('/api/inventory/items')
          .then(function (res) {
            if (!res.ok) {
              throw new Error('Lỗi khi tải dữ liệu kho');
            }
            return res.json();
          })
          .then(function (items) {
            if (!Array.isArray(items)) {
              throw new Error('Dữ liệu trả về không hợp lệ');
            }
            allItems = items;
            renderTable(allItems);
            updateSummary(allItems);
          })
          .catch(function (err) {
            console.error(err);
            renderTable([]);
          });
      }

      // Tìm kiếm theo tên nguyên liệu / danh mục
      if (searchInput && tableBody) {
        searchInput.addEventListener('input', function () {
          var keyword = searchInput.value.trim().toLowerCase();
          var rows = tableBody.querySelectorAll('tr');
          rows.forEach(function (row) {
            var nameCell = row.cells[0] ? row.cells[0].textContent.toLowerCase() : '';
            var categoryCell = row.cells[1] ? row.cells[1].textContent.toLowerCase() : '';
            if (!keyword || nameCell.indexOf(keyword) !== -1 || categoryCell.indexOf(keyword) !== -1) {
              row.style.display = '';
            } else {
              row.style.display = 'none';
            }
          });
        });
      }

      // Lọc theo danh mục
      if (filterButtons && tableBody) {
        filterButtons.forEach(function (btn) {
          btn.addEventListener('click', function () {
            filterButtons.forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');

            var filterText = btn.textContent.trim().toLowerCase();
            var rows = tableBody.querySelectorAll('tr');

            rows.forEach(function (row) {
              var categoryCell = row.cells[1] ? row.cells[1].textContent.toLowerCase() : '';
              if (filterText === 'tất cả' || categoryCell.indexOf(filterText) !== -1) {
                row.style.display = '';
              } else {
                row.style.display = 'none';
              }
            });
          });
        });
      }
    });
  </script>
</body>

</html>
